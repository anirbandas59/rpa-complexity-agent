[project]
name = "rpa-complexity-agent"
version = "0.1.0"
description = "AI-powered RPA process complexity assessment agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10.0,<3.0",
    "pydantic-settings>=2.7.0,<3.0",
    "python-dotenv>=1.0.0",
    "langgraph~=0.6",
    "langchain~=0.3",
    "langchain-core~=0.3",
    "pymupdf>=1.25.0",
    "python-docx>=1.0.0",        # 1.x has breaking API changes vs 0.8.x
    "pdfplumber>=0.11.0",
    "unstructured>=0.21.0",
    "anthropic>=0.84.0",
    "openai>=2.0.0",              # 2.x has breaking API changes vs 1.x
    "openpyxl>=3.1.5",
    "reportlab>=4.2.0",
    "fastapi>=0.115.0,<1.0",
    "uvicorn>=0.30.0,<1.0",
    "python-multipart>=0.0.18",
    "streamlit>=1.40.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",               # 2.x has breaking changes vs 1.x
    "httpx>=0.27.0",
    "aiosqlite>=0.22.1",
    "slowapi>=0.1.9",
    "plotly>=6.6.0",
    "redis[asyncio]>=7.3.0",
]

[project.optional-dependencies]
frontend = [
    "streamlit>=1.40.0",
    "httpx>=0.27.0",
    "plotly>=6.6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",     # 1.x has breaking changes vs 0.x
    "pytest-cov>=6.0.0",
    "black>=26.0.0",
    "ruff>=0.15.0",
    "mypy>=1.15.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
log_cli = true
log_cli_level = "INFO"
markers = [
    "integration: marks tests that make real API calls (deselect with '-m \"not integration\"')",
]
addopts = "--ignore=tests/unit/test_excel_gen.py"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
