[project]
name = "rpa-complexity-agent"
version = "0.1.0"
description = "AI-powered RPA process complexity assessment agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "langgraph>=0.0.40",
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "pymupdf>=1.23.0",
    "python-docx>=0.8.11",
    "pdfplumber>=0.10.0",
    "unstructured>=0.10.0",
    "anthropic>=0.20.0",
    "openai>=1.10.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.6",
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "httpx>=0.25.0",
    "aiosqlite>=0.22.1",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
frontend = [
    "streamlit>=1.32.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
log_cli = true
log_cli_level = "INFO"
markers = [
    "integration: marks tests that make real API calls (deselect with '-m \"not integration\"')",
]
addopts = "--ignore=tests/unit/test_excel_gen.py"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
