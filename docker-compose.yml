services:

  redis:
    image: redis:7-alpine
    container_name: rpa_assessment_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rpa_net

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: rpa_assessment_api
    ports:
      - "8000:8000"
    volumes:
      - ./data/outputs:/app/data/outputs
      - ./data/temp:/app/data/temp
      - ./logs:/app/logs
    # Requires .env in project root — copy from .env.example and fill in values
    env_file:
      - .env
    environment:
      - LOG_LEVEL=INFO
      - OUTPUT_DIR=data/outputs
      - TEMP_DIR=data/temp
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rpa_net
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c",
             "import urllib.request, sys; r = urllib.request.urlopen('http://localhost:8000/api/health', timeout=8); sys.exit(0 if r.status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: rpa_assessment_frontend
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rpa_net

networks:
  rpa_net:
    driver: bridge
