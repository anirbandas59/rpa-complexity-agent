services:

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: rpa_assessment_api
    ports:
      - "8000:8000"
    volumes:
      - ./data/outputs:/app/data/outputs
      - ./data/temp:/app/data/temp
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - LOG_LEVEL=INFO
      - OUTPUT_DIR=data/outputs
      - TEMP_DIR=data/temp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f",
             "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: rpa_assessment_frontend
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  outputs:
  temp:
  logs:
